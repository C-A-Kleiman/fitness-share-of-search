version: 2

sources:
  - name: raw
    tables:
      - name: pageviews
        meta:
          external_location: "read_csv('../data/raw/pageviews/*.csv', header = true)"
        loaded_at_field: "cast(view_date as timestamp)"
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 7, period: day}